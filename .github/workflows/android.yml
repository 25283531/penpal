name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No setup-android step: ubuntu-latest runners already ship the Android
      # SDK (ANDROID_HOME pre-set). setup-android@v3 fails because it tries to
      # install the removed 'tools' package via sdkmanager (exit code 1).
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools"
          ls -d "$ANDROID_HOME/platforms/android-34"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: app
        run: gradle assembleDebug --stacktrace

      # Run the local unit tests (incl. the navigation tests that prove
      # the bottom-tab destinations). Previously CI only assembled the
      # APK, so unit tests were never executed anywhere.
      - name: Run unit tests
        working-directory: app
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penpal-debug-apk
          path: app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
